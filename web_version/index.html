<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>iPod Classic iPhone 4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ipod-device">
    <!-- Pantalla LCD -->
    <div class="ipod-screen">
      <div class="screen-header">
        <span class="header-title" id="headerTitle">iPod</span>
        <div class="header-icons">
          <span id="playStateIcon">▶</span>
          <span class="battery-icon">🔋</span>
        </div>
      </div>

      <!-- Vista de Menú -->
      <div class="screen-body" id="menuBody">
        <ul class="menu-list" id="menuList">
          <!-- Generado dinámicamente -->
        </ul>
      </div>

      <!-- Vista Reproduciendo -->
      <div class="screen-body now-playing-body hidden" id="nowPlayingBody">
        <div class="now-playing-top">
          <div class="album-art" id="albumArt">🎵</div>
          <div class="song-info">
            <div class="song-title" id="songTitle">Selecciona Canción</div>
            <div class="song-artist" id="songArtist">Artista</div>
            <div class="song-album" id="songAlbum">Álbum</div>
          </div>
        </div>
        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="time-labels">
            <span id="currentTime">0:00</span>
            <span id="remainingTime">-0:00</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Click Wheel (Rueda del iPod) -->
    <div class="click-wheel" id="clickWheel">
      <button class="wheel-btn btn-menu" id="btnMenu">MENU</button>
      <button class="wheel-btn btn-prev" id="btnPrev">◀◀</button>
      <button class="wheel-btn btn-next" id="btnNext">▶▶</button>
      <button class="wheel-btn btn-play" id="btnPlay">▶❚❚</button>
      
      <div class="center-button" id="btnSelect"></div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>
  <audio id="clickSound" src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="></audio>

  <script src="app.js"></script>
</body>
</html>
