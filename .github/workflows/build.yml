name: Compilar IPA Nativo iOS 6 (iPhone 4)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Código Fuente
      uses: actions/checkout@v4

    - name: Compilar App Nativa con Clang
      run: |
        mkdir -p iPodClassiciOS6.app
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        
        xcrun -sdk iphoneos clang -O2 \
          -isysroot "$SDK_PATH" \
          -fobjc-arc \
          -framework UIKit \
          -framework Foundation \
          -framework CoreGraphics \
          -framework QuartzCore \
          -framework AVFoundation \
          -framework MediaPlayer \
          -framework AudioToolbox \
          iPodClassiciOS6/main.m \
          iPodClassiciOS6/AppDelegate.m \
          iPodClassiciOS6/ViewController.m \
          iPodClassiciOS6/ClickWheelView.m \
          iPodClassiciOS6/iPodDisplayView.m \
          iPodClassiciOS6/MusicLibraryManager.m \
          -o iPodClassiciOS6.app/iPodClassiciOS6

        cp iPodClassiciOS6/Info.plist iPodClassiciOS6.app/Info.plist

    - name: Empaquetar como Archivo .IPA
      run: |
        mkdir -p Payload
        cp -R iPodClassiciOS6.app Payload/
        zip -r iPodClassiciOS6.ipa Payload/

    - name: Subir Artifact IPA para Descargar
      uses: actions/upload-artifact@v4
      with:
        name: iPodClassiciOS6-iPhone4-IPA
        path: iPodClassiciOS6.ipa
